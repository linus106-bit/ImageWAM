<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">DreamZero-style cross-chunk sparse attention with ImageWAM modality isolation</title>
  <desc id="desc">A publication-ready attention mask for three chunks. Noisy target image and action tokens share instruction, clean observation history, and state conditioning, but cannot directly attend to each other.</desc>
  <defs>
    <style>
      .heading { font: 600 28px Arial, Helvetica, sans-serif; fill: #17202a; }
      .subheading { font: 600 21px Arial, Helvetica, sans-serif; fill: #17202a; }
      .axis { font: 600 16px Arial, Helvetica, sans-serif; fill: #17202a; }
      .token { font: 600 15px Arial, Helvetica, sans-serif; fill: #17202a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #46515c; }
      .note { font: 400 14px Arial, Helvetica, sans-serif; fill: #59636e; }
      .legend { font: 400 15px Arial, Helvetica, sans-serif; fill: #26313c; dominant-baseline: middle; }
      .band { font: 600 14px Arial, Helvetica, sans-serif; fill: #26313c; text-anchor: middle; dominant-baseline: middle; }
      .cell { width: 42px; height: 42px; stroke: #ffffff; stroke-width: 1.5; }
      .cond { fill: #4c78a8; }
      .target { fill: #f58518; }
      .action { fill: #54a24b; }
      .state { fill: #b279a2; }
      .blocked { stroke: #d64545; stroke-width: 3.2; stroke-linecap: round; }
      .arrow { stroke: #46515c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <rect id="cell" width="42" height="42" rx="2"/>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#46515c"/>
    </marker>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>

  <!-- Panel (a): effective logical mask -->
  <text x="55" y="52" class="heading">(a) Effective cross-chunk sparse mask (K = 3)</text>
  <text x="55" y="80" class="small">Rows are queries; columns are keys. Filled cells are visible to attention.</text>

  <!-- Column group bands -->
  <rect x="190" y="98" width="42" height="24" rx="4" fill="#dce8f3"/>
  <rect x="232" y="98" width="126" height="24" rx="4" fill="#dce8f3"/>
  <rect x="358" y="98" width="126" height="24" rx="4" fill="#f6e5d3"/>
  <rect x="484" y="98" width="126" height="24" rx="4" fill="#e9edf1"/>
  <rect x="610" y="98" width="126" height="24" rx="4" fill="#f6e5d3"/>
  <text x="211" y="110" class="band">Instr.</text>
  <text x="295" y="110" class="band">Clean history</text>
  <text x="421" y="110" class="band">Chunk 0</text>
  <text x="547" y="110" class="band">Chunk 1</text>
  <text x="673" y="110" class="band">Chunk 2</text>

  <!-- Column token labels -->
  <g class="token">
    <text x="211" y="142">I</text><text x="253" y="142">O₀</text><text x="295" y="142">O₁</text><text x="337" y="142">O₂</text>
    <text x="379" y="142">T₀</text><text x="421" y="142">A₀</text><text x="463" y="142">S₀</text>
    <text x="505" y="142">T₁</text><text x="547" y="142">A₁</text><text x="589" y="142">S₁</text>
    <text x="631" y="142">T₂</text><text x="673" y="142">A₂</text><text x="715" y="142">S₂</text>
  </g>
  <text x="463" y="91" class="axis" text-anchor="middle">KEY</text>
  <text x="77" y="438" class="axis" text-anchor="middle" transform="rotate(-90 77 438)">QUERY</text>

  <!-- Matrix background and row labels -->
  <rect x="190" y="154" width="546" height="546" fill="#edf0f2" stroke="#aeb7c0" stroke-width="1.5"/>
  <g class="token">
    <text x="164" y="175">I</text><text x="164" y="217">O₀</text><text x="164" y="259">O₁</text><text x="164" y="301">O₂</text>
    <text x="164" y="343">T₀</text><text x="164" y="385">A₀</text><text x="164" y="427">S₀</text>
    <text x="164" y="469">T₁</text><text x="164" y="511">A₁</text><text x="164" y="553">S₁</text>
    <text x="164" y="595">T₂</text><text x="164" y="637">A₂</text><text x="164" y="679">S₂</text>
  </g>

  <!-- Instruction and causal clean-history cells -->
  <g class="cond">
    <use href="#cell" x="190" y="154"/>
    <use href="#cell" x="190" y="196"/><use href="#cell" x="232" y="196"/>
    <use href="#cell" x="190" y="238"/><use href="#cell" x="232" y="238"/><use href="#cell" x="274" y="238"/>
    <use href="#cell" x="190" y="280"/><use href="#cell" x="232" y="280"/><use href="#cell" x="274" y="280"/><use href="#cell" x="316" y="280"/>

    <use href="#cell" x="190" y="322"/><use href="#cell" x="232" y="322"/>
    <use href="#cell" x="190" y="364"/><use href="#cell" x="232" y="364"/>

    <use href="#cell" x="190" y="448"/><use href="#cell" x="232" y="448"/><use href="#cell" x="274" y="448"/>
    <use href="#cell" x="190" y="490"/><use href="#cell" x="232" y="490"/><use href="#cell" x="274" y="490"/>

    <use href="#cell" x="190" y="574"/><use href="#cell" x="232" y="574"/><use href="#cell" x="274" y="574"/><use href="#cell" x="316" y="574"/>
    <use href="#cell" x="190" y="616"/><use href="#cell" x="232" y="616"/><use href="#cell" x="274" y="616"/><use href="#cell" x="316" y="616"/>
  </g>

  <!-- Modality-local and state cells -->
  <g class="target">
    <use href="#cell" x="358" y="322"/><use href="#cell" x="484" y="448"/><use href="#cell" x="610" y="574"/>
  </g>
  <g class="action">
    <use href="#cell" x="400" y="364"/><use href="#cell" x="526" y="490"/><use href="#cell" x="652" y="616"/>
  </g>
  <g class="state">
    <use href="#cell" x="442" y="322"/><use href="#cell" x="442" y="364"/><use href="#cell" x="442" y="406"/>
    <use href="#cell" x="568" y="448"/><use href="#cell" x="568" y="490"/><use href="#cell" x="568" y="532"/>
    <use href="#cell" x="694" y="574"/><use href="#cell" x="694" y="616"/><use href="#cell" x="694" y="658"/>
  </g>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.95">
    <path d="M232 154V700 M274 154V700 M316 154V700 M358 154V700 M400 154V700 M442 154V700 M484 154V700 M526 154V700 M568 154V700 M610 154V700 M652 154V700 M694 154V700"/>
    <path d="M190 196H736 M190 238H736 M190 280H736 M190 322H736 M190 364H736 M190 406H736 M190 448H736 M190 490H736 M190 532H736 M190 574H736 M190 616H736 M190 658H736"/>
  </g>
  <g stroke="#7f8a94" stroke-width="2" opacity="0.8">
    <path d="M358 154V700 M484 154V700 M610 154V700"/>
    <path d="M190 322H736 M190 448H736 M190 574H736"/>
  </g>

  <!-- Explicitly blocked target/action pairs -->
  <g class="blocked">
    <path d="M407 329L435 357 M435 329L407 357"/><path d="M365 371L393 399 M393 371L365 399"/>
    <path d="M533 455L561 483 M561 455L533 483"/><path d="M491 497L519 525 M519 497L491 525"/>
    <path d="M659 581L687 609 M687 581L659 609"/><path d="M617 623L645 651 M645 623L617 651"/>
  </g>

  <!-- Panel (b): per-chunk abstraction -->
  <text x="820" y="52" class="heading">(b) ImageWAM modality isolation inside chunk i</text>
  <text x="820" y="80" class="small">Pᵢ = instruction + clean observations O₀…Oᵢ</text>

  <text x="1130" y="127" class="axis" text-anchor="middle">KEY</text>
  <text x="850" y="348" class="axis" text-anchor="middle" transform="rotate(-90 850 348)">QUERY</text>
  <g class="token">
    <text x="1000" y="150">Pᵢ</text><text x="1080" y="150">Tᵢ</text><text x="1160" y="150">Aᵢ</text><text x="1240" y="150">Sᵢ</text>
    <text x="930" y="200">Pᵢ</text><text x="930" y="280">Tᵢ</text><text x="930" y="360">Aᵢ</text><text x="930" y="440">Sᵢ</text>
  </g>
  <rect x="960" y="160" width="320" height="320" fill="#edf0f2" stroke="#aeb7c0" stroke-width="1.5"/>
  <g class="cond"><rect x="960" y="160" width="80" height="80"/><rect x="960" y="240" width="80" height="80"/><rect x="960" y="320" width="80" height="80"/></g>
  <g class="target"><rect x="1040" y="240" width="80" height="80"/></g>
  <g class="action"><rect x="1120" y="320" width="80" height="80"/></g>
  <g class="state"><rect x="1200" y="240" width="80" height="80"/><rect x="1200" y="320" width="80" height="80"/><rect x="1200" y="400" width="80" height="80"/></g>
  <g stroke="#ffffff" stroke-width="2">
    <path d="M1040 160V480 M1120 160V480 M1200 160V480 M960 240H1280 M960 320H1280 M960 400H1280"/>
  </g>
  <g class="blocked">
    <path d="M1138 258L1182 302 M1182 258L1138 302"/>
    <path d="M1058 338L1102 382 M1102 338L1058 382"/>
  </g>

  <!-- One-call execution schematic -->
  <text x="820" y="550" class="subheading">One sparse attention call per MoT layer</text>
  <g>
    <rect x="825" y="590" width="145" height="62" rx="9" fill="#f3f6f8" stroke="#aeb7c0"/>
    <rect x="825" y="670" width="145" height="62" rx="9" fill="#f3f6f8" stroke="#aeb7c0"/>
    <rect x="825" y="750" width="145" height="62" rx="9" fill="#f3f6f8" stroke="#aeb7c0"/>
    <text x="897" y="614" class="token">Chunk 0 Q/K/V</text><text x="897" y="636" class="note" text-anchor="middle">own timestep / AdaLN</text>
    <text x="897" y="694" class="token">Chunk 1 Q/K/V</text><text x="897" y="716" class="note" text-anchor="middle">own timestep / AdaLN</text>
    <text x="897" y="774" class="token">Chunk 2 Q/K/V</text><text x="897" y="796" class="note" text-anchor="middle">own timestep / AdaLN</text>
    <path d="M970 621H1040 M970 701H1040 M970 781H1040" class="arrow"/>
    <path d="M1040 621V781" stroke="#46515c" stroke-width="2" fill="none"/>
    <path d="M1040 701H1100" class="arrow"/>
    <rect x="1100" y="655" width="210" height="92" rx="12" fill="#e8eef4" stroke="#4c78a8" stroke-width="2"/>
    <text x="1205" y="686" class="token">Concatenate sequence axis</text>
    <text x="1205" y="711" class="token">+ block-sparse FlexAttention</text>
    <text x="1205" y="734" class="note" text-anchor="middle">then split residuals by chunk</text>
  </g>

  <!-- Legend -->
  <g transform="translate(55 832)">
    <rect x="0" y="0" width="22" height="22" rx="3" fill="#4c78a8"/><text x="31" y="11" class="legend">shared conditioning / clean history</text>
    <rect x="300" y="0" width="22" height="22" rx="3" fill="#f58518"/><text x="331" y="11" class="legend">target-image noise</text>
    <rect x="500" y="0" width="22" height="22" rx="3" fill="#54a24b"/><text x="531" y="11" class="legend">action noise</text>
    <rect x="675" y="0" width="22" height="22" rx="3" fill="#b279a2"/><text x="706" y="11" class="legend">state conditioning / self</text>
    <path d="M930 2L950 20 M950 2L930 20" class="blocked"/><text x="962" y="11" class="legend">explicitly blocked Tᵢ ↔ Aᵢ edge</text>
  </g>
  <text x="55" y="875" class="note">Conceptual token groups are shown for clarity; state is carried in the FLUX.2 context stream in the implementation.</text>
</svg>
